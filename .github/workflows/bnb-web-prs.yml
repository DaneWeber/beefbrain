name: bnb-web Playwright

on:
  push:
    branches:
      - main
    paths:
      - "packages/bnb-web/**"
      - "packages/bnb-core/**"
      - "packages/bnb-latex/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/bnb-web-prs.yml"
  pull_request:
    paths:
      - "packages/bnb-web/**"
      - "packages/bnb-core/**"
      - "packages/bnb-latex/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/bnb-web-prs.yml"

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm --filter bnb-web exec playwright install --with-deps chromium

      - name: Run bnb-web Playwright tests
        run: pnpm --filter bnb-web test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            packages/bnb-web/playwright-report/**
            packages/bnb-web/test-results/**
          if-no-files-found: error
          retention-days: 14
