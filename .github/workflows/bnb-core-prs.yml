name: bnb-core Tests

on:
  pull_request:
    paths:
      - "packages/bnb-core/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/bnb-core-prs.yml"
  push:
    branches:
      - main
    paths:
      - "packages/bnb-core/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/bnb-core-prs.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build bnb-core
        run: pnpm --filter bnb-core build

      - name: Run bnb-core tests with coverage
        run: pnpm --filter bnb-core test:coverage

      - name: Run bnb-core linting
        run: pnpm --filter bnb-core lint

      - name: Run bnb-core formatting check
        run: pnpm --filter bnb-core format

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./packages/bnb-core/coverage/lcov.info
          flags: bnb-core
          fail_ci_if_error: false
