name: bnb-web GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "packages/bnb-web/**"
      - "packages/bnb-core/**"
      - "packages/bnb-latex/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/bnb-web-pages.yml"
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - "data/**"
      - "packages/bnb-web/**"
      - "packages/bnb-core/**"
      - "packages/bnb-latex/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/bnb-web-pages.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bnb-web-github-pages
  cancel-in-progress: false

jobs:
  production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          BASE_PATH: /beefbrain
          BNB_READ_ONLY: "true"
          GITHUB_PAGES: "true"
        run: |
          pnpm --filter bnb-core --filter bnb-latex build
          pnpm --filter bnb-web build

      - name: Deploy production site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: packages/bnb-web/build
          clean-exclude: pr-preview
          force: false

  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile

      - name: Build PR preview
        if: github.event.action != 'closed'
        env:
          BASE_PATH: /beefbrain/pr-preview/pr-${{ github.event.number }}
          BNB_READ_ONLY: "true"
          GITHUB_PAGES: "true"
        run: |
          pnpm --filter bnb-core --filter bnb-latex build
          pnpm --filter bnb-web build

      - name: Deploy or remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: packages/bnb-web/build
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          wait-for-pages-deployment: true
