name: Build bnb-ext from main

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: node and pnpm setup
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Build bnb-core
        run: pnpm --filter bnb-core build

      - name: Build bnb-ext
        run: pnpm --filter bnb-ext build

      - name: Package VSIX
        shell: bash
        run: |
          version=$(node -p "require('./packages/bnb-ext/package.json').version")
          mkdir -p artifacts
          pnpm --filter bnb-ext exec vsce package \
            --no-dependencies \
            --out "$GITHUB_WORKSPACE/artifacts/bnb-ext-${version}-${GITHUB_SHA::7}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: bnb-ext-main-${{ github.sha }}
          path: artifacts/*.vsix
          if-no-files-found: error
